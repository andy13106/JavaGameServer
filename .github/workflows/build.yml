name: build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: gameframe_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -ntp verify
        env:
          GAME_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          GAME_TEST_REDIS_URI: redis://127.0.0.1:6379
          GAME_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/gameframe_test?allowPublicKeyRetrieval=true&useSSL=false
          GAME_TEST_MYSQL_USER: root
          GAME_TEST_MYSQL_PASSWORD: test-only
